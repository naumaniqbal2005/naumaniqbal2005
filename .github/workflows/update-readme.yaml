name: update readme timestamp

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update timestamp
        run: |
          git config user.name "naumaniqbal2005"
          git config user.email "210031533+naumaniqbal2005@users.noreply.github.com"
          sed -i "s|Last updated:.*|Last updated: $(date -u '+%Y-%m-%d %H:%M UTC')|" README.md
          git add README.md
          git commit -m "chore: update timestamp" || echo "nothing to commit"
          git push